name: Build

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
    paths:
      - "snap/**"
      - ".github/workflows/**"
      - ".image-garden.mk"
      - "spread.yaml"
      - "tests/**"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "snap/**"
      - ".github/workflows/**"
      - ".image-garden.mk"
      - "spread.yaml"
      - "tests/**"
  workflow_dispatch:
    inputs:
      skip-spread-tests:
        type: boolean
        description: Skip image-garden smoke tests and publish after approval
        default: false

concurrency:
  group: build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route channel
    runs-on: ubuntu-26.04
    outputs:
      snapstore-channel: ${{ steps.route.outputs.snapstore-channel }}
    steps:
      - name: Resolve Snap Store channel
        id: route
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          OVERRIDE: ${{ vars.SNAPCRAFT_CHANNEL }}
        run: |
          set -euo pipefail
          case "$REF_TYPE" in
            tag) channel=latest/candidate ;;
            *) channel="${OVERRIDE:-latest/edge}" ;;
          esac
          if [[ "$channel" != latest/* ]]; then
            echo "Goose supports only the latest track: $channel" >&2
            exit 1
          fi
          echo "snapstore-channel=$channel" >> "$GITHUB_OUTPUT"

  snap-build-test-publish:
    needs: route
    uses: ./.github/workflows/tasteful-crafts.yml
    with:
      snapstore-channel: ${{ needs.route.outputs.snapstore-channel }}
      skip-spread-tests: ${{ inputs.skip-spread-tests || false }}
    secrets:
      publish-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
