name: Promote

on:
  workflow_dispatch:
    inputs:
      risk:
        description: Risk level to promote into
        required: true
        default: stable
        type: choice
        options:
          - beta
          - stable

jobs:
  promote:
    name: latest/candidate to latest/${{ inputs.risk }}
    runs-on: ubuntu-24.04
    environment:
      name: latest/${{ inputs.risk }}
      deployment: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pkgproxy
        id: pkgproxy
        uses: zyga/setup-pkgproxy@v1

      - name: Install Snapcraft
        shell: bash
        run: sudo snap install snapcraft --channel latest/stable --classic

      - name: Read snap name
        id: snap-name
        run: |
          set -euo pipefail
          name="$(sed -nE 's/^name:[[:space:]]*([^[:space:]#]+).*$/\1/p' snap/snapcraft.yaml | head -n1)"
          if [ -z "$name" ]; then
            echo "snap name not found" >&2
            exit 1
          fi
          echo "value=$name" >> "$GITHUB_OUTPUT"

      - name: Promote revision
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_NAME: ${{ steps.snap-name.outputs.value }}
        run: |
          set -euo pipefail
          snapcraft promote \
            --from-channel=latest/candidate \
            --to-channel="latest/${{ inputs.risk }}" \
            --yes \
            "$SNAP_NAME"

      - name: Prepare pkgproxy cache
        if: ${{ always() }}
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      - name: Save pkgproxy cache
        if: ${{ steps.pkgproxy.outputs.package-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: ${{ steps.pkgproxy.outputs.package-cache-key-success }}
