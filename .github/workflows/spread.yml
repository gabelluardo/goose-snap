name: spread

on:
  workflow_call:
    inputs:
      snap-artifact:
        type: string
        required: true
      spread-system:
        type: string
        required: true
      enable-pkgproxy:
        type: boolean
        required: false
        default: true
      image-garden-channel:
        type: string
        required: false
        default: latest/stable

jobs:
  smoke:
    name: ${{ inputs.spread-system }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download snap
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.snap-artifact }}
          path: .

      - name: Set up pkgproxy
        if: ${{ inputs.enable-pkgproxy }}
        id: pkgproxy
        uses: zyga/setup-pkgproxy@v1

      - name: Install image-garden and spread
        shell: bash
        run: sudo snap install "image-garden+qemu-x86-64+spread" --channel "${{ inputs.image-garden-channel }}"

      - name: Use spread from image-garden
        run: sudo snap alias image-garden.spread spread

      - name: Cache base images
        uses: actions/cache@v6
        with:
          path: ~/snap/image-garden/common/cache/dl
          key: image-garden-${{ inputs.spread-system }}-x86-64

      - name: Enable KVM for the runner
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create test image
        run: |
          mkdir -p ~/snap/image-garden/common/cache/dl
          image-garden make \
            ${{ inputs.spread-system }}.x86_64.qcow2 \
            ${{ inputs.spread-system }}.x86_64.run \
            ${{ inputs.spread-system }}.x86_64.user-data \
            ${{ inputs.spread-system }}.x86_64.meta-data \
            ${{ inputs.spread-system }}.x86_64.seed.iso

      - name: Run smoke suite
        env:
          SPREAD_ARCH: x86_64
        run: |
          set +e
          spread -v garden:${{ inputs.spread-system }}:tests/smoke/ 2>&1 | tee spread.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload spread log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spread-log-${{ inputs.spread-system }}
          path: spread.log
          if-no-files-found: ignore

      - name: Upload image-garden logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: image-garden-logs-${{ inputs.spread-system }}
          path: .image-garden/*.log
          if-no-files-found: ignore

      - name: Prepare pkgproxy cache
        if: ${{ inputs.enable-pkgproxy && always() }}
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      - name: Save pkgproxy cache
        if: ${{ inputs.enable-pkgproxy && steps.pkgproxy.outputs.package-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: ${{ steps.pkgproxy.outputs.package-cache-key-success }}
