name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to release, for example v1.43.0
        required: true
        type: string
      target:
        description: Branch or SHA to tag
        required: false
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release notes
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve release context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const isDispatch = context.eventName === "workflow_dispatch";
            const tag = isDispatch
              ? context.payload.inputs?.version
              : context.ref.replace("refs/tags/", "");
            const target = isDispatch
              ? (context.payload.inputs?.target || "main")
              : context.payload.repository.default_branch;

            if (!tag || !/^v\d+\.\d+\.\d+(?:[-+].*)?$/.test(tag)) {
              core.setFailed(`Invalid tag '${tag}'. Use v<major>.<minor>.<patch>.`);
              return;
            }

            core.setOutput("tag", tag);
            core.setOutput("target", target);

      - name: Validate packaged and upstream versions
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && steps.context.outputs.target || steps.context.outputs.tag }}
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            const targetRef = process.env.TARGET_REF;

            function parseSemver(tag) {
              const match = /^v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(tag || "");
              if (!match) return null;
              return match.slice(1, 4).map(Number);
            }

            function compareSemver(left, right) {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            }

            const content = await github.rest.repos.getContent({
              ...context.repo,
              path: "snap/snapcraft.yaml",
              ref: targetRef,
            });
            if (!("content" in content.data)) {
              core.setFailed("Could not read snap/snapcraft.yaml from the target ref.");
              return;
            }

            const snapcraft = Buffer.from(content.data.content, "base64").toString("utf8");
            const matches = [
              ...snapcraft.matchAll(/source-tag:\s*(?:&[^\s]+\s+)?(v[^\s#]+)/g),
            ].map((match) => match[1]);
            const packagedTags = [...new Set(matches)];
            if (packagedTags.length !== 1) {
              core.setFailed(`Expected one packaged Goose source-tag, found: ${packagedTags.join(", ") || "none"}.`);
              return;
            }

            const packagedTag = packagedTags[0];
            const upstream = await github.rest.repos.getLatestRelease({
              owner: "aaif-goose",
              repo: "goose",
            });
            const upstreamTag = upstream.data.tag_name;
            const releaseVersion = parseSemver(releaseTag);
            const upstreamVersion = parseSemver(upstreamTag);

            if (releaseTag !== packagedTag) {
              core.setFailed(`Release ${releaseTag} must match packaged Goose tag ${packagedTag}.`);
              return;
            }
            if (!releaseVersion || !upstreamVersion) {
              core.setFailed(`Could not parse release=${releaseTag} or upstream=${upstreamTag} as semver.`);
              return;
            }
            if (compareSemver(releaseVersion, upstreamVersion) > 0) {
              core.setFailed(`Release ${releaseTag} is newer than upstream ${upstreamTag}.`);
              return;
            }

            core.info(`Validated ${releaseTag} against packaged and upstream versions.`);

      - name: Create tag from target branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          TARGET_BRANCH: ${{ steps.context.outputs.target }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              ...context.repo,
              branch: process.env.TARGET_BRANCH,
            });
            try {
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/tags/${process.env.RELEASE_TAG}`,
                sha: branch.data.commit.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.info(`Tag ${process.env.RELEASE_TAG} already exists.`);
            }

      - name: Create or update GitHub release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        with:
          script: |
            const currentTag = process.env.RELEASE_TAG;

            function parseSemver(tag) {
              const match = /^v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(tag || "");
              return match ? match.slice(1, 4).map(Number) : null;
            }

            function compareSemver(left, right) {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            }

            function extractNotes(body) {
              if (!body) return null;
              const heading = /(?:^|\n)#{2,6}\s*(?:Release Notes?|Changelog)\s*\n/i.exec(body);
              if (!heading || heading.index === undefined) return null;
              const rest = body.slice(heading.index + heading[0].length);
              const delimiter = rest.search(/\n---\n/);
              const section = delimiter >= 0 ? rest.slice(0, delimiter) : rest;
              const notes = section
                .replace(/<details>/gi, "")
                .replace(/<\/details>/gi, "")
                .replace(/<summary>([\s\S]*?)<\/summary>/gi, (_match, title) => `#### ${String(title).trim()}`)
                .replace(/\n{3,}/g, "\n\n")
                .trim();
              return notes || null;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo,
              per_page: 100,
            });
            const currentVersion = parseSemver(currentTag);
            const previous = tags
              .map((tag) => ({ name: tag.name, version: parseSemver(tag.name) }))
              .filter((tag) => tag.version && tag.name !== currentTag)
              .filter((tag) => currentVersion && compareSemver(tag.version, currentVersion) < 0)
              .sort((left, right) => compareSemver(left.version, right.version))
              .at(-1);

            const pullRequests = new Map();
            if (previous) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${previous.name}...${currentTag}`,
              });
              for (const commit of comparison.data.commits) {
                const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...context.repo,
                  commit_sha: commit.sha,
                  per_page: 100,
                });
                for (const pull of pulls.data) {
                  if (pull.merged_at && pull.user?.login === "renovate[bot]") {
                    pullRequests.set(pull.number, pull);
                  }
                }
              }
            }

            const lines = ["## Renovate updates", ""];
            const renovatePulls = [...pullRequests.values()]
              .sort((left, right) => new Date(left.merged_at) - new Date(right.merged_at));
            if (renovatePulls.length === 0) {
              lines.push("No Renovate pull requests were detected for this release range.", "");
            }
            for (const pull of renovatePulls) {
              lines.push(`### #${pull.number} ${pull.title}`, `- PR: ${pull.html_url}`);
              const notes = extractNotes(pull.body);
              lines.push(notes ? `\n${notes}` : "- No changelog section found in PR body.", "");
            }
            const body = lines.join("\n").trim();

            try {
              const release = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: currentTag,
              });
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: release.data.id,
                tag_name: currentTag,
                name: currentTag,
                body,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: currentTag,
                name: currentTag,
                body,
                draft: false,
                prerelease: false,
              });
            }
